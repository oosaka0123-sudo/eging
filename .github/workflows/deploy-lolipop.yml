name: Deploy to Lolipop

on:
  workflow_dispatch:

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
          PRIVATE_DIR: ${{ vars.LOLIPOP_PRIVATE_DIR }}
          SITE_URL: ${{ vars.LOLIPOP_SITE_URL }}
          DB_HOST: ${{ secrets.LOLIPOP_DB_HOST }}
          DB_NAME: ${{ secrets.LOLIPOP_DB_NAME }}
          DB_USER: ${{ secrets.LOLIPOP_DB_USER }}
          DB_PASSWORD: ${{ secrets.LOLIPOP_DB_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.EGING_ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD DEPLOY_DIR PRIVATE_DIR SITE_URL; do
            test -n "${!v}"
          done
          test "$SITE_URL" = "https://eging.rss7.net"
          test "$DEPLOY_DIR" = "/eging"
          test "$PRIVATE_DIR" = "/eging/_private"

          runtime_values=("$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$ADMIN_PASSWORD_HASH")
          configured=0
          for value in "${runtime_values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured+1))
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "RUNTIME_CONFIG=0" >> "$GITHUB_ENV"
            echo "DB/admin secrets are not configured; deploying public site with dynamic services unavailable."
          elif [[ "$configured" -eq 5 ]]; then
            case "$ADMIN_PASSWORD_HASH" in
              '$2y$'*|'$2b$'*|'$argon2id$'*) ;;
              *) echo "EGING_ADMIN_PASSWORD_HASH is not a password_hash() value"; exit 1 ;;
            esac
            echo "RUNTIME_CONFIG=1" >> "$GITHUB_ENV"
          else
            echo "DB/admin secrets are partially configured; refusing deployment."
            exit 1
          fi

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build runtime files
        shell: bash
        env:
          DB_HOST: ${{ secrets.LOLIPOP_DB_HOST }}
          DB_NAME: ${{ secrets.LOLIPOP_DB_NAME }}
          DB_USER: ${{ secrets.LOLIPOP_DB_USER }}
          DB_PASSWORD: ${{ secrets.LOLIPOP_DB_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.EGING_ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          cat > .runtime/private.htaccess <<'HTACCESS'
          <IfModule mod_authz_core.c>
          Require all denied
          </IfModule>
          <IfModule !mod_authz_core.c>
          Order allow,deny
          Deny from all
          </IfModule>
          HTACCESS

          if [[ "${RUNTIME_CONFIG:-0}" == "1" ]]; then
            php -r '
            $cfg = [
              "app_url" => "https://eging.rss7.net",
              "db" => [
                "host" => getenv("DB_HOST"),
                "port" => 3306,
                "name" => getenv("DB_NAME"),
                "user" => getenv("DB_USER"),
                "pass" => getenv("DB_PASSWORD"),
              ],
              "admin_password_hash" => getenv("ADMIN_PASSWORD_HASH"),
            ];
            file_put_contents(".runtime/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
            '
            php -l .runtime/config.php
          fi

      - name: Build launch assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg lftp librsvg2-bin
          mkdir -p public/assets/video public/assets/brand
          rsvg-convert -w 1200 -h 630 public/assets/brand/og-default.svg -o public/assets/brand/og-default.png
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=0x061014:s=1280x720:r=24:d=2.2" \
            -vf "noise=alls=7:allf=t+u,drawgrid=w=128:h=72:t=1:c=0x65f5db@0.08,vignette=PI/5,fade=t=in:st=0:d=0.35,fade=t=out:st=1.85:d=0.35" \
            -an -c:v libx264 -preset veryslow -crf 28 -pix_fmt yuv420p -movflags +faststart \
            public/assets/video/opening.mp4

      - name: Deploy without destructive sync
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
          DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
          PRIVATE_DIR: ${{ vars.LOLIPOP_PRIVATE_DIR }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          ensure_remote_dir() {
            local remote_path="$1"
            if lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" -e "
              set cmd:fail-exit yes;
              set net:max-retries 1;
              set net:timeout 15;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              cls -1 \"$remote_path\";
              bye;
            " >/dev/null 2>&1; then
              return 0
            fi
            lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" -e "
              set cmd:fail-exit yes;
              set net:max-retries 1;
              set net:timeout 15;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate yes;
              mkdir \"$remote_path\";
              bye;
            "
          }

          ensure_remote_dir "$PRIVATE_DIR"
          ensure_remote_dir "$PRIVATE_DIR/app"
          ensure_remote_dir "$PRIVATE_DIR/config"
          ensure_remote_dir "$PRIVATE_DIR/database"
          ensure_remote_dir "$PRIVATE_DIR/var"
          ensure_remote_dir "$PRIVATE_DIR/var/sessions"
          ensure_remote_dir "$PRIVATE_DIR/var/login-rate"

          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mirror -R --verbose --only-newer --parallel=2 public/ "$DEPLOY_DIR/"
          put .runtime/private.htaccess -o "$PRIVATE_DIR/.htaccess"
          mirror -R --verbose --only-newer app/ "$PRIVATE_DIR/app/"
          mirror -R --verbose --only-newer database/ "$PRIVATE_DIR/database/"
          EOF

          if [[ "${RUNTIME_CONFIG:-0}" == "1" ]]; then
            lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<EOF
            set cmd:fail-exit yes
            set net:max-retries 2
            set net:timeout 20
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate yes
            put .runtime/config.php -o "$PRIVATE_DIR/config/config.php"
            bye
            EOF
          fi

      - name: Verify public site
        shell: bash
        env:
          SITE_URL: ${{ vars.LOLIPOP_SITE_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 "$SITE_URL/health.php" | grep -q '"ok":true'
          curl --fail --silent --show-error --location --retry 3 "$SITE_URL/" > /tmp/home.html
          grep -q "EGING GEAR LAB" /tmp/home.html
          curl --fail --silent --show-error --location "$SITE_URL/robots.txt" | grep -q "sitemap.xml"
