name: Production Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
          DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
          PRIVATE_DIR: ${{ vars.LOLIPOP_PRIVATE_DIR }}
          SITE_URL: ${{ vars.LOLIPOP_SITE_URL }}
          DB_HOST: ${{ secrets.LOLIPOP_DB_HOST }}
          DB_NAME: ${{ secrets.LOLIPOP_DB_NAME }}
          DB_USER: ${{ secrets.LOLIPOP_DB_USER }}
          DB_PASSWORD: ${{ secrets.LOLIPOP_DB_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.EGING_ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD DEPLOY_DIR PRIVATE_DIR SITE_URL; do
            if [[ -z "${!v}" ]]; then
              echo "Missing required production setting: $v"
              exit 1
            fi
          done

          test "$SITE_URL" = "https://eging.rss7.net"
          test "$DEPLOY_DIR" = "/eging"
          test "$PRIVATE_DIR" = "/eging/_private"

          runtime_values=("$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$ADMIN_PASSWORD_HASH")
          configured=0
          for value in "${runtime_values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured+1))
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "RUNTIME_CONFIG=0" >> "$GITHUB_ENV"
            echo "Dynamic DB/admin runtime is not configured yet."
          elif [[ "$configured" -eq 5 ]]; then
            case "$ADMIN_PASSWORD_HASH" in
              '$2y$'*|'$2b$'*|'$argon2id$'*) ;;
              *) echo "EGING_ADMIN_PASSWORD_HASH is not a password_hash() value"; exit 1 ;;
            esac
            echo "RUNTIME_CONFIG=1" >> "$GITHUB_ENV"
          else
            echo "DB/admin secrets are partially configured."
            exit 1
          fi

      - name: Install clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp default-mysql-client

      - name: Verify FTPS login and public target
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
          DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cls -1 "$DEPLOY_DIR"
          bye
          EOF

      - name: Verify MySQL login when configured
        if: env.RUNTIME_CONFIG == '1'
        shell: bash
        env:
          DB_HOST: ${{ secrets.LOLIPOP_DB_HOST }}
          DB_NAME: ${{ secrets.LOLIPOP_DB_NAME }}
          DB_USER: ${{ secrets.LOLIPOP_DB_USER }}
          DB_PASSWORD: ${{ secrets.LOLIPOP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          MYSQL_PWD="$DB_PASSWORD" mysql             --connect-timeout=10             --host="$DB_HOST"             --user="$DB_USER"             --database="$DB_NAME"             --execute="SELECT 1;" >/dev/null
          echo "MySQL connection OK"

      - name: Report
        run: |
          echo "Production preflight passed."
          if [[ "${RUNTIME_CONFIG:-0}" == "1" ]]; then
            echo "Static and dynamic runtime checks passed."
          else
            echo "Static deployment is ready; DB-backed features remain unavailable until DB/admin secrets are configured."
          fi
