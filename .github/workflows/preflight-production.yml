name: Production Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
          DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
          SITE_URL: ${{ vars.LOLIPOP_SITE_URL }}
          DB_HOST: ${{ secrets.LOLIPOP_DB_HOST }}
          DB_NAME: ${{ secrets.LOLIPOP_DB_NAME }}
          DB_USER: ${{ secrets.LOLIPOP_DB_USER }}
          DB_PASSWORD: ${{ secrets.LOLIPOP_DB_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.EGING_ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          for v in FTP_HOST FTP_USER FTP_PASSWORD DEPLOY_DIR SITE_URL DB_HOST DB_NAME DB_USER DB_PASSWORD ADMIN_PASSWORD_HASH; do
            if [ -z "${!v}" ]; then
              echo "Missing required production setting: $v"
              exit 1
            fi
          done
          test "$SITE_URL" = "https://eging.rss7.net"
          case "$DEPLOY_DIR" in
            */public|*/public/) ;;
            *) echo "LOLIPOP_DEPLOY_DIR must end in /public"; exit 1 ;;
          esac
          case "$ADMIN_PASSWORD_HASH" in
            '$2y$'*|'$2b$'*|'$argon2id$'*) ;;
            *) echo "EGING_ADMIN_PASSWORD_HASH does not look like a password_hash() value"; exit 1 ;;
          esac

      - name: Install clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp default-mysql-client

      - name: Verify FTPS login and target directory
        shell: bash
        env:
          FTP_HOST: ${{ secrets.LOLIPOP_FTP_HOST }}
          FTP_USER: ${{ secrets.LOLIPOP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          FTP_PORT: ${{ vars.LOLIPOP_FTP_PORT }}
          DEPLOY_DIR: ${{ vars.LOLIPOP_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$PORT" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cls -1 "$DEPLOY_DIR"
          bye
          EOF

      - name: Verify MySQL login
        shell: bash
        env:
          DB_HOST: ${{ secrets.LOLIPOP_DB_HOST }}
          DB_NAME: ${{ secrets.LOLIPOP_DB_NAME }}
          DB_USER: ${{ secrets.LOLIPOP_DB_USER }}
          DB_PASSWORD: ${{ secrets.LOLIPOP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          MYSQL_PWD="$DB_PASSWORD" mysql             --connect-timeout=10             --host="$DB_HOST"             --user="$DB_USER"             --database="$DB_NAME"             --execute="SELECT 1;" >/dev/null
          echo "MySQL connection OK"

      - name: Report
        run: |
          echo "Production preflight passed."
          echo "No server files or database records were modified."
