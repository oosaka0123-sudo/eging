<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タックル条件逆引きシミュレーター｜エギングギアラボ</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f8;color:#151515}
main{max-width:760px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:6px;font-weight:700}
select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #bbb}
button{margin-top:16px;width:100%;font-weight:800;cursor:pointer}
.result{margin-top:18px;padding:16px;background:#f0f3f5;border-radius:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>タックル条件逆引きシミュレーター</h1>
<p>季節・釣り場・水深・風・潮から、まず狙うべきタックル基準を出します。</p>
<form class="card" id="sim">
<div class="grid">
<label>季節<select name="season"><option value="spring">春</option><option value="autumn">秋</option></select></label>
<label>釣り場<select name="field"><option value="port">堤防・漁港</option><option value="rock">磯</option><option value="surf">サーフ</option></select></label>
<label>水深<select name="depth"><option value="shallow">浅場</option><option value="mid">中層</option><option value="deep">深場</option></select></label>
<label>風<select name="wind"><option value="low">弱い</option><option value="mid">普通</option><option value="strong">強い</option></select></label>
<label>潮<select name="current"><option value="slow">緩い</option><option value="normal">普通</option><option value="fast">速い</option></select></label>
</div>
<button type="submit">おすすめ基準を表示</button>
</form>
<div class="result" id="result" aria-live="polite">条件を選んで診断してください。</div>
</main>
<script>
const form=document.querySelector('#sim'),out=document.querySelector('#result');
form.addEventListener('submit',e=>{
 e.preventDefault();
 const d=new FormData(form),season=d.get('season'),field=d.get('field'),depth=d.get('depth'),wind=d.get('wind'),current=d.get('current');
 let rod='ML〜M / 8.3〜8.6ft',egi=season==='autumn'?'2.5〜3.0号':'3.5号',pe=season==='autumn'?'0.5〜0.6号':'0.6〜0.8号',leader='1.75〜2.5号',note=[];
 if(field==='rock'){rod='M中心 / 8.6〜9ft';note.push('足場と取り回しより遠投・主導権を優先');}
 if(field==='surf'){rod='M中心 / 8.6〜9ft';note.push('飛距離を取りやすい長さを優先');}
 if(depth==='deep'||current==='fast'){egi=season==='autumn'?'3.0号ディープ寄り':'3.5号ディープ寄り';note.push('底取りを優先して沈下速度を上げる');}
 if(wind==='strong'){pe=season==='autumn'?'0.5〜0.6号':'0.6号前後';note.push('風の影響を抑えるため太くし過ぎない');}
 out.innerHTML='<strong>基準タックル</strong><br>ロッド: '+rod+'<br>エギ: '+egi+'<br>PE: '+pe+'<br>リーダー: '+leader+'<br><small>'+ (note.length?note.join('／'):'標準条件。操作性と汎用性を優先。') +'</small>';
});
</script>
</body>
</html>
